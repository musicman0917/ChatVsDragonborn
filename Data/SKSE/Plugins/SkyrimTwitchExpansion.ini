; SkyrimTwitchExpansion boot-time configuration.
; Live-editable prices/timers/toggles live in the sibling
; SkyrimTwitchExpansion.json instead (generated on first run) so they can be
; changed from the in-game MCM menu without restarting Skyrim.

[Logging]
; trace | debug | info | warn | err | off
LogLevel = info

[Bridge]
; Named pipe the TwitchBridge companion app connects to. Must match
; TwitchBridge/TwitchBridge.App/appsettings.json -> Skyrim:PipeName.
PipeName = SkyrimTwitchExpansion
; Seconds to wait for TwitchBridge to (re)connect before logging a warning.
ConnectTimeoutSeconds = 30

[Update]
CheckForUpdatesOnStartup = true
GitHubOwner = musicman0917
GitHubRepo = ChatVsDragonborn
