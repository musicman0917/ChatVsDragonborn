iEarthquakePrice=150
iDragonPrice=1000
iChickensPrice=200
iCheesePrice=75
iAddGoldPrice=50
iRemoveGoldPrice=150
iInvertPrice=300
iLowGravityPrice=400
iYeetPrice=120

