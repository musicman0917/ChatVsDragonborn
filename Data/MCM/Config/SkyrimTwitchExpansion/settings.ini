; Declares every ModSettingInt control's default value for MCM Helper's
; SettingStore (see SettingStore::LoadDefaults / ReadINI in the MCM Helper
; source) -- config.json's own "defaultValue" only affects the slider
; widget's visual bounds, NOT the actual registered setting, so without
; this file every GetModSettingInt() call returns -1 (SettingStore's
; "not found" sentinel) until a player manually saves a value. Section
; names and keys must exactly match each control's "id" in config.json
; (id: "iRagdollPrice:ChaosPrices" -> section [ChaosPrices], key
; iRagdollPrice). Keep in sync with SKSEPlugin/src/Settings/Settings.cpp's
; own defaults and Data/MCM/Config/SkyrimTwitchExpansion/config.json's
; defaultValue fields -- nothing generates this automatically.

[ChaosPrices]
